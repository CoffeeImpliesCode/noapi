<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>noapi WebGPU examples</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, sans-serif;
            background: #101418;
            color: #e7edf2;
        }
        body {
            box-sizing: border-box;
            width: min(100% - 2rem, 72rem);
            margin: 2rem auto;
        }
        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin: 1.25rem 0;
        }
        nav a {
            padding: 0.6rem 0.9rem;
            border: 1px solid #52606b;
            border-radius: 0.4rem;
            color: inherit;
            text-decoration: none;
        }
        nav a[aria-current="page"] {
            border-color: #55c9b4;
            background: #17332f;
        }
        #status {
            min-height: 1.5rem;
            color: #b9c7d1;
        }
        #status[data-error="true"] {
            color: #ff9b9b;
        }
        canvas {
            display: block;
            width: 100%;
            height: min(72vh, 42rem);
            border: 1px solid #52606b;
            background: #20272d;
        }
    </style>
</head>
<body>
    <h1>noapi WebGPU examples</h1>
    <nav aria-label="Examples">
        <a href="?example=1_triangle" data-example="1_triangle">1_triangle</a>
        <a href="?example=2_textures" data-example="2_textures">2_textures</a>
    </nav>
    <p id="status" role="status" aria-live="polite">Starting WebGPU…</p>
    <canvas id="canvas" aria-label="WebGPU example output"></canvas>

    <script type="module">
        const canvas = document.querySelector("#canvas");
        const status = document.querySelector("#status");
        const links = [...document.querySelectorAll("nav a[data-example]")];
        const exampleIds = new Map([
            ["1_triangle", 1],
            ["2_textures", 2],
        ]);
        const exampleName = new URLSearchParams(location.search).get("example")
            ?? "1_triangle";
        const exampleId = exampleIds.get(exampleName);
        let module = null;
        let device = null;
        let frameHandle = 0;
        let active = false;

        for (const link of links) {
            if (link.dataset.example === exampleName) {
                link.setAttribute("aria-current", "page");
            }
        }

        function setStatus(message, isError = false) {
            status.textContent = message;
            status.dataset.error = String(isError);
        }

        function resultMessage(code) {
            const messages = new Map([
                [1, "The requested example is not supported."],
                [2, "The WebGPU example is already active."],
                [3, "WebAssembly could not allocate memory."],
                [4, "The noapi WebGPU device could not initialize."],
                [5, "The canvas WebGPU surface could not initialize."],
                [6, "The WGSL shader could not initialize."],
                [7, "The example buffers could not initialize."],
                [8, "The example textures could not initialize."],
                [20, "The WebGPU surface could not begin a frame."],
                [21, "The WebGPU frame could not be submitted."],
                [23, "The WebGPU frame callback ran without an active example."],
            ]);
            return messages.get(code) ?? `The WebGPU example failed (code ${code}).`;
        }

        function stop() {
            active = false;
            if (frameHandle !== 0) {
                cancelAnimationFrame(frameHandle);
                frameHandle = 0;
            }
            if (module !== null) {
                const result = module._noapiStop();
                if (result !== 0) console.warn(resultMessage(result));
                module = null;
            }
            if (device !== null) {
                device.destroy();
                device = null;
            }
        }

        function fail(message) {
            stop();
            setStatus(message, true);
            console.error(message);
        }

        function resizeCanvas() {
            const bounds = canvas.getBoundingClientRect();
            const scale = window.devicePixelRatio || 1;
            const width = Math.max(1, Math.round(bounds.width * scale));
            const height = Math.max(1, Math.round(bounds.height * scale));
            if (canvas.width !== width) canvas.width = width;
            if (canvas.height !== height) canvas.height = height;
            return { width, height };
        }

        function draw(timeMs) {
            if (!active || module === null) return;
            const { width, height } = resizeCanvas();
            const result = module._noapiFrame(timeMs, width, height);
            if (result !== 0) {
                fail(resultMessage(result));
                return;
            }
            frameHandle = requestAnimationFrame(draw);
        }

        window.addEventListener("pagehide", stop, { once: true });

        try {
            if (exampleId === undefined) {
                throw new Error(
                    `Unknown example “${exampleName}”. Choose 1_triangle or 2_textures.`,
                );
            }
            if (!navigator.gpu) {
                throw new Error(
                    "WebGPU is unavailable. Use a WebGPU-capable browser in a secure context.",
                );
            }
            const adapter = await navigator.gpu.requestAdapter();
            if (adapter === null) {
                throw new Error(
                    "No WebGPU adapter is available. Check browser and GPU support.",
                );
            }
            try {
                device = await adapter.requestDevice();
            } catch (error) {
                const message = error instanceof Error ? error.message : String(error);
                throw new Error(`WebGPU could not create a device: ${message}`);
            }
            const context = canvas.getContext("webgpu");
            if (context === null) {
                throw new Error("The browser could not create a WebGPU canvas context.");
            }
            resizeCanvas();

            const { default: createNoapi } = await import("./noapi.js");
            module = await createNoapi({
                noapiDevice: device,
                noapiContext: context,
                noInitialRun: true,
            });
            const startResult = module._noapiStart(exampleId);
            if (startResult !== 0) {
                throw new Error(resultMessage(startResult));
            }

            active = true;
            setStatus(`Running ${exampleName}.`);
            device.lost.then((info) => {
                if (active) fail(`The WebGPU device was lost: ${info.message}`);
            });
            frameHandle = requestAnimationFrame(draw);
        } catch (error) {
            fail(error instanceof Error ? error.message : String(error));
        }
    </script>
</body>
</html>
